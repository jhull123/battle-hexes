name: Test Python Packages

on:
  push:
    paths:
      - 'battle_hexes_api/**'
      - 'battle_hexes_core/**'
      - 'battle_agent_rl/**'
      - 'server-side-checks.sh'
      - 'pyproject.toml'
      - 'requirements-test.txt'
      - 'requirements-ppo.txt'
      - 'requirements-ppo-x86-serving.txt'
      - '.github/workflows/api-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ppo-x86-serving.txt

      - name: Verify committed x86 PPO checkpoint loads
        run: |
          PYTHONPATH=battle_hexes_core/src:battle_agent_rl/src python -c "from battle_agent_rl.ppo.playable_artifact import load_model; load_model('battle_agent_rl/archive/ppo/x86_64')"

      - name: Run checks
        run: ./server-side-checks.sh

      - name: Train Q-learning agent
        run: ./battle_agent_rl/train_qlearning.sh 10
